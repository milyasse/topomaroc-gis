<!doctype html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TopoMaroc GIS</title>
  <meta name="description" content="Application SIG topographique pour le Maroc : Lambert Maroc (Merchich), UTM, WGS 84, navigation GPS vers un point, levé de points, calcul de superficies, exports DXF/PDF/XLSX. Fonctionne hors ligne.">
  <meta name="theme-color" content="#0f3d5e">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' blob: data: https://nominatim.openstreetmap.org; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TopoMaroc">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="modulepreload" href="src/app.js">
  <script type="module" src="src/app.js"></script>
</head>
<body class="booting">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 8l-2.5 5.5L8 16l2.5-5.5z"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
      <symbol id="i-nav-arrow" viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z" fill="currentColor" stroke-linejoin="round"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-polygon" viewBox="0 0 24 24"><path d="M5 9l7-6 8 6-3 11H7z"/><circle cx="12" cy="3" r="1.4" fill="currentColor"/><circle cx="20" cy="9" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/><circle cx="7" cy="20" r="1.4" fill="currentColor"/><circle cx="5" cy="9" r="1.4" fill="currentColor"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></symbol>
      <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></symbol>
      <symbol id="i-line" viewBox="0 0 24 24"><path d="M4 18 10 10l4 4 6-8"/><circle cx="4" cy="18" r="1.5" fill="currentColor"/><circle cx="20" cy="6" r="1.5" fill="currentColor"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
      <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M4 3l7 17 2-7 7-2z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="Accueil TopoMaroc GIS">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <span class="brand-name">TopoMaroc <span>GIS</span></span>
      </a>
      <button id="chip-project" class="chip" type="button" aria-label="Projet en cours"></button>
      <button id="chip-crs" class="chip chip-crs" type="button" aria-label="Système de coordonnées affiché"></button>
      <span class="spacer"></span>
      <button id="gps-pill" class="gps-pill" type="button" aria-label="État du GPS"></button>
      <a class="icon-btn top-help" href="#/help" aria-label="Aide"><svg class="ic"><use href="#i-help"/></svg></a>
    </header>

    <main class="stage">
      <div id="map" role="application" aria-label="Carte"></div>
      <div class="map-ctrls" role="toolbar" aria-label="Contrôles de la carte">
        <button id="btn-zin" class="map-btn" type="button" aria-label="Zoom avant" title="Zoom avant"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="btn-zout" class="map-btn" type="button" aria-label="Zoom arrière" title="Zoom arrière"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="btn-locate" class="map-btn" type="button" aria-label="Ma position (suivi)" title="Ma position (suivi)"><svg class="ic"><use href="#i-locate"/></svg></button>
        <button id="btn-extent" class="map-btn" type="button" aria-label="Emprise initiale" title="Emprise du projet / du Maroc"><svg class="ic"><use href="#i-globe"/></svg></button>
        <button id="btn-layers" class="map-btn" type="button" aria-label="Couches" title="Couches et fonds"><svg class="ic"><use href="#i-layers"/></svg></button>
        <button id="btn-full" class="map-btn" type="button" aria-label="Plein écran" title="Plein écran"><svg class="ic"><use href="#i-expand"/></svg></button>
      </div>
      <div class="north-badge" aria-hidden="true" title="La carte est toujours orientée nord en haut">N</div>
      <div class="center-cross" aria-hidden="true"></div>
      <button id="coordbar" class="coordbar" type="button" aria-label="Coordonnées (toucher pour copier)"></button>

      <section id="sheet" class="sheet" hidden aria-labelledby="sheet-title">
        <div id="sheet-handle" class="sheet-handle" role="button" tabindex="0" aria-label="Agrandir ou réduire le panneau"><span></span></div>
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button id="sheet-close" class="icon-btn" type="button" aria-label="Fermer le panneau"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
        <div id="sheet-content" class="sheet-content"></div>
      </section>

      <section id="home" class="home" hidden aria-label="Accueil"></section>
    </main>

    <nav class="dock" aria-label="Navigation principale">
      <a href="#/home" data-route="home"><svg class="ic"><use href="#i-home"/></svg><span>Accueil</span></a>
      <a href="#/map" data-route="map"><svg class="ic"><use href="#i-map"/></svg><span>Carte</span></a>
      <a href="#/nav" data-route="nav" class="dock-main"><svg class="ic"><use href="#i-target"/></svg><span>Aller à</span></a>
      <a href="#/survey" data-route="survey"><svg class="ic"><use href="#i-pin"/></svg><span>Levé</span></a>
      <a href="#/parcels" data-route="parcels"><svg class="ic"><use href="#i-polygon"/></svg><span>Parcelles</span></a>
      <a href="#/tools" data-route="tools"><svg class="ic"><use href="#i-ruler"/></svg><span>Outils</span></a>
    </nav>
  </div>

  <div class="boot">
    <img src="icons/icon.svg" alt="" width="72" height="72">
    <p id="boot-msg">Chargement de TopoMaroc GIS…</p>
    <noscript><p>JavaScript est nécessaire pour utiliser cette application.</p></noscript>
  </div>
</body>
</html>
