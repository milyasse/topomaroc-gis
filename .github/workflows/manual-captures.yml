name: Captures du manuel

# Captures d'écran du manuel utilisateur, prises sur l'application publiée (fonds de carte et MNT réels).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-captures
  cancel-in-progress: true

jobs:
  captures:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://milyasse.github.io/topomaroc-gis/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Captures sur le site publié
        run: |
          rm -rf docs/manuel/captures
          node tools/manual/captures.mjs "${SITE_URL}" docs/manuel/captures
      - name: Publication des captures dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manuel/captures
          git diff --cached --quiet && exit 0
          git commit -q -m "docs(manuel): captures d'écran ${GITHUB_SHA::7} [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
