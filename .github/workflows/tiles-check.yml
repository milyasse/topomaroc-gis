name: Disponibilité des tuiles satellite (Maroc)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/tiles-check.mjs', '.github/workflows/tiles-check.yml']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/tiles-check.mjs
      - name: Commit du résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/resultats-tests/tuiles.json
          git diff --cached --quiet && exit 0
          git commit -q -m "docs: disponibilité des tuiles satellite [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
