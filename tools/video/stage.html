<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TopoMaroc GIS — scène vidéo</title>
<style>
  :root { --navy: #0f3d5e; --navy-2: #0b2f49; --blue: #14527c; --orange: #d6602a; --orange-2: #f3a679; --soft: #eef2f6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--navy); }
  body { font-family: Inter, "DejaVu Sans", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 78% 30%, #17507a 0%, var(--navy) 45%, var(--navy-2) 100%); }
  #topo { position: absolute; inset: -10%; opacity: .16; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .brand { position: absolute; display: flex; align-items: center; gap: 14px; font: 700 26px "Inter Display", Inter; letter-spacing: .01em; }
  .brand img { width: 44px; height: 44px; border-radius: 11px; background: #fff; padding: 3px; }
  .brand span { color: var(--orange-2); }

  /* Téléphone */
  .phone { position: absolute; border-radius: 54px; background: #0a1520; padding: 13px; box-shadow: 0 40px 80px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.08) inset; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #dfe6ec; }
  .phone .shot { position: absolute; inset: 0; transform-origin: 0 0; }
  .phone .shot img { display: block; width: 100%; height: auto; }
  .hl { position: absolute; border: 6px solid var(--orange); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(8,25,40,.28), 0 0 30px rgba(214,96,42,.85); opacity: 0; }
  .doc { position: absolute; background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,.45); border-radius: 6px; overflow: hidden; }
  .doc img { width: 100%; display: block; }
  .laptop { position: absolute; }
  .laptop .lid { background: #0a1520; border-radius: 22px 22px 0 0; padding: 18px 18px 22px; box-shadow: 0 40px 80px rgba(0,0,0,.45); }
  .laptop .lid img { display: block; width: 100%; border-radius: 6px; }
  .laptop .base { height: 22px; margin: 0 -60px; background: linear-gradient(#c9d3dc, #8b98a5); border-radius: 0 0 26px 26px; }

  /* Textes */
  .col { position: absolute; }
  .num { font: 800 30px "Inter Display", Inter; color: var(--orange-2); letter-spacing: .12em; display: flex; align-items: center; gap: 16px; }
  .num::after { content: ""; width: 72px; height: 3px; background: var(--orange); border-radius: 2px; }
  .title { font: 800 76px/1.04 "Inter Display", Inter; letter-spacing: -.015em; margin-top: 22px; }
  .title .w { display: inline-block; white-space: pre; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 38px; }
  .chip { font: 650 34px Inter; padding: 10px 24px; border-radius: 999px; border: 2.5px solid var(--orange); color: #fff; background: rgba(214,96,42,.14); }
  .note { margin-top: 30px; font: 500 26px Inter; color: #cfe0ec; display: flex; gap: 12px; align-items: center; }
  .note::before { content: "!"; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--orange); color: #fff; font: 800 22px Inter; display: grid; place-items: center; }

  /* Héros / fin */
  .hero-logo { position: absolute; width: 150px; height: 150px; border-radius: 36px; background: #fff; padding: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .hero-title { position: absolute; font: 800 120px/1 "Inter Display", Inter; letter-spacing: -.02em; white-space: nowrap; }
  .hero-title span { color: var(--orange-2); }
  .hero-sub { position: absolute; font: 500 40px Inter; color: #d5e2ec; }
  .halo { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(214,96,42,.55) 0%, rgba(214,96,42,0) 65%); }
  .cta { position: absolute; font: 800 64px/1.12 "Inter Display", Inter; text-align: center; letter-spacing: -.01em; }
  .cta-note { position: absolute; font: 500 26px Inter; color: #b8cad8; text-align: center; }

  /* Transition */
  #wipe { position: absolute; border-radius: 50%; background: var(--orange); pointer-events: none; opacity: 0; }

  /* Sous-titres */
  #subs { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  #subs .line { display: inline-block; font: 600 var(--subfs)/1.32 Inter; color: #fff; background: rgba(6,24,38,.82); padding: 10px 26px 12px; border-radius: 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  #bar { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--orange); width: 0; }
</style>
</head>
<body>
<div id="stage">
  <svg id="topo" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="scenes"></div>
  <div id="wipe"></div>
  <div id="subs"></div>
  <div id="bar"></div>
</div>
<script type="module">
import { gsap } from '../../vendor/gsap.mjs';

const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') || '16x9';
const data = await (await fetch('scenes.json')).json();
const cfg = data.formats[FMT];
const W = cfg.width, H = cfg.height, V = H > W;
document.documentElement.style.setProperty('--W', W + 'px');
document.documentElement.style.setProperty('--H', H + 'px');
document.documentElement.style.setProperty('--subfs', V ? '44px' : '38px');
let timing;
try { timing = await (await fetch(q.get('timing') || `build/${FMT}/timing.json`)).json(); } catch { timing = null; }
if (!timing) {
  // estimation (≈ 14 caractères/s) pour les essais sans voix off
  let t = 0.6; timing = { scenes: [] };
  for (const s of cfg.scenes) { const d = s.text.length / 14.5 + 1.4; timing.scenes.push({ id: s.id, start: t, dur: d, cues: [{ t0: t + .4, t1: t + d - .4, text: s.text }] }); t += d; }
  timing.total = t + 1.2;
}
const CAP = '../../docs/manuel/captures/';
const SW = 780, SH = 1688; // taille des captures de téléphone (px)
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const events = []; // effets sonores : { t, type }

// --- Fond : courbes de niveau procédurales (déterministes)
{
  const svg = document.getElementById('topo'); let paths = '';
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const centers = [[260, 320], [720, 640], [540, 180], [150, 820]];
  for (const [cx, cy] of centers) {
    const ph = rnd() * 6;
    for (let k = 1; k <= 9; k++) {
      const r0 = 26 * k; let d = '';
      for (let a = 0; a <= 64; a++) {
        const th = a / 64 * Math.PI * 2;
        const r = r0 * (1 + .18 * Math.sin(3 * th + ph + k * .3) + .08 * Math.sin(5 * th - ph));
        d += `${a ? 'L' : 'M'}${(cx + r * Math.cos(th)).toFixed(1)},${(cy + r * .8 * Math.sin(th)).toFixed(1)}`;
      }
      paths += `<path d="${d}Z" fill="none" stroke="#9fd0f0" stroke-width="${k % 3 === 0 ? 1.6 : .8}"/>`;
    }
  }
  svg.innerHTML = paths;
}

// --- Construction des éléments
function phone(x, y, h) {
  const w = Math.round((h - 26) * SW / SH) + 26;
  const p = el('div', 'phone'); Object.assign(p.style, { left: x - w / 2 + 'px', top: y - h / 2 + 'px', width: w + 'px', height: h + 'px' });
  const sc = el('div', 'screen'); p.append(sc);
  return { p, sc, w, h, sw: w - 26, sh: h - 26 };
}
function addShot(ph, s) {
  const d = el('div', 'shot'); const img = el('img'); img.src = CAP + s.img + '.png'; d.append(img); ph.sc.append(d);
  let hl = null;
  if (s.hl) {
    const k = ph.sw / SW; hl = el('div', 'hl');
    Object.assign(hl.style, { left: s.hl[0] * k - 8 + 'px', top: s.hl[1] * k - 8 + 'px', width: s.hl[2] * k + 16 + 'px', height: s.hl[3] * k + 16 + 'px' });
    d.append(hl);
  }
  return { d, hl };
}
function titleHTML(t) { return t.split(' ').map((w) => `<span class="w">${w} </span>`).join(''); }
function textCol(s, box) {
  const c = el('div', 'col'); Object.assign(c.style, box);
  if (s.num) c.append(el('div', 'num', s.num));
  const t = el('div', 'title', titleHTML(s.title)); if (V) t.style.fontSize = '68px'; c.append(t);
  let chips = null;
  if (s.chips) { chips = el('div', 'chips'); s.chips.forEach((x) => chips.append(el('span', 'chip', x))); if (V) chips.style.justifyContent = 'center'; c.append(chips); }
  let note = null; if (s.note) { note = el('div', 'note', s.note); if (V) note.style.justifyContent = 'center'; c.append(note); }
  return c;
}

const master = gsap.timeline({ paused: true });
const root = document.getElementById('scenes');
const brandEl = el('div', 'brand', `<img src="../../icons/icon.svg" alt=""><div>TopoMaroc <span>GIS</span></div>`);
Object.assign(brandEl.style, V ? { left: '60px', top: '60px' } : { left: '64px', top: '52px' });

cfg.scenes.forEach((s, i) => {
  const tm = timing.scenes[i]; const t0 = tm.start, dur = tm.dur, t1 = t0 + dur;
  const sc = el('div', 'scene'); root.append(sc);
  master.set(sc, { visibility: 'visible' }, Math.max(0, t0 - 0.35));
  if (i < cfg.scenes.length - 1) master.set(sc, { visibility: 'hidden' }, t1 + 0.4);
  if (i > 0) events.push({ t: t0 - 0.35, type: 'whoosh' });

  if (s.layout === 'hero' || s.layout === 'outro') {
    const hero = s.layout === 'hero';
    const halo = el('div', 'halo'); const hs = V ? 1100 : 1000;
    Object.assign(halo.style, { width: hs + 'px', height: hs + 'px', left: (V ? W / 2 : (hero ? 560 : W / 2)) - hs / 2 + 'px', top: (V ? 640 : H / 2) - hs / 2 + 'px' });
    sc.append(halo);
    master.fromTo(halo, { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.6, ease: 'power2.out' }, t0);
    master.to(halo, { scale: 1.12, duration: dur, ease: 'sine.inOut' }, t0 + 1.6);
    const logo = el('img', 'hero-logo'); logo.src = '../../icons/icon.svg'; sc.append(logo);
    if (hero) {
      const title = el('div', 'hero-title', 'TopoMaroc <span>GIS</span>'); const sub = el('div', 'hero-sub', s.sub);
      sc.append(title, sub);
      if (V) {
        Object.assign(logo.style, { left: W / 2 - 75 + 'px', top: '230px' });
        Object.assign(title.style, { left: 0, width: W + 'px', textAlign: 'center', top: '420px', fontSize: '104px' });
        Object.assign(sub.style, { left: 0, width: W + 'px', textAlign: 'center', top: '548px', fontSize: '36px' });
        const ph = phone(W / 2, 1150, 780); sc.append(ph.p); addShot(ph, s.shots[0]);
        master.fromTo(ph.p, { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 1.4, ease: 'power3.out' }, t0 + .9);
        master.to(ph.p, { y: -30, duration: dur, ease: 'none' }, t0 + 2.3);
      } else {
        Object.assign(logo.style, { left: '120px', top: '300px' });
        Object.assign(title.style, { left: '118px', top: '490px' });
        Object.assign(sub.style, { left: '122px', top: '636px' });
        const xs = [1180, 1470, 1760], ys = [600, 540, 620], hs2 = [760, 820, 740];
        s.shots.forEach((sh, k) => {
          const ph = phone(xs[k], ys[k], hs2[k]); sc.append(ph.p); addShot(ph, sh);
          master.fromTo(ph.p, { y: 700 + k * 120, rotation: 4 - k * 3 }, { y: 0, rotation: (k - 1) * 3, duration: 1.6, ease: 'power3.out' }, t0 + .5 + k * .18);
          master.to(ph.p, { y: -40 - k * 25, duration: dur, ease: 'none' }, t0 + 2.1 + k * .18);
        });
      }
      master.fromTo(logo, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 1, ease: 'back.out(1.6)' }, t0 + .1);
      master.fromTo(title, { y: 60, opacity: 0, clipPath: 'inset(0 100% 0 0)' }, { y: 0, opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: 1.1, ease: 'power3.out' }, t0 + .45);
      master.fromTo(sub, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .9, ease: 'power2.out' }, t0 + 1.1);
    } else {
      const cta = el('div', 'cta', s.title); const note = el('div', 'cta-note', s.note);
      const brand = el('div', 'hero-title', 'TopoMaroc <span>GIS</span>');
      sc.append(brand, cta, note);
      Object.assign(logo.style, { left: W / 2 - 75 + 'px', top: (V ? 520 : 150) + 'px' });
      Object.assign(brand.style, { left: 0, width: W + 'px', textAlign: 'center', top: (V ? 720 : 340) + 'px', fontSize: (V ? 100 : 104) + 'px' });
      Object.assign(cta.style, { left: (V ? 80 : 260) + 'px', width: W - (V ? 160 : 520) + 'px', top: (V ? 900 : 520) + 'px', fontSize: (V ? 58 : 60) + 'px' });
      Object.assign(note.style, { left: 0, width: W + 'px', top: (V ? 1260 : 770) + 'px' });
      master.fromTo(logo, { scale: 0 }, { scale: 1, duration: .9, ease: 'back.out(1.7)' }, t0 + .1);
      master.fromTo(brand, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .9, ease: 'power3.out' }, t0 + .4);
      master.fromTo(cta, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: 'power3.out' }, t0 + .9);
      master.fromTo(note, { opacity: 0 }, { opacity: 1, duration: .8 }, t0 + 1.6);
      master.to(logo, { scale: 1.06, yoyo: true, repeat: 3, duration: 1.2, ease: 'sine.inOut' }, t0 + 1.2);
      events.push({ t: t0 + .2, type: 'rise' });
    }
    return;
  }

  // Marque discrète
  const b = brandEl.cloneNode(true); sc.append(b);
  master.fromTo(b, { opacity: 0 }, { opacity: .9, duration: .6 }, t0);

  // Colonne de texte
  const col = textCol(s, V ? { left: '70px', width: W - 140 + 'px', top: '150px', textAlign: 'center' } : { left: (s.layout === 'grid' || s.layout === 'desk' ? 1240 : 930) + 'px', width: (s.layout === 'grid' || s.layout === 'desk' ? 600 : 860) + 'px', top: '300px' });
  if (V) col.querySelector('.num')?.style.setProperty('justify-content', 'center');
  sc.append(col);
  const words = col.querySelectorAll('.title .w');
  master.fromTo(col.querySelector('.num'), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: .6, ease: 'power2.out' }, t0 + .15);
  master.fromTo(words, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: .7, ease: 'power3.out', stagger: .07 }, t0 + .3);
  const chips = col.querySelectorAll('.chip');
  const chipT = t0 + .9;
  if (s.layout === 'grid') master.fromTo(chips, { y: -160, opacity: 0, rotation: () => gsap.utils.random(-12, 12, 1) }, { y: 0, opacity: 1, rotation: 0, duration: .8, ease: 'bounce.out', stagger: .12 }, chipT);
  else master.fromTo(chips, { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2)', stagger: .12 }, chipT);
  const note = col.querySelector('.note'); if (note) master.fromTo(note, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .6 }, t0 + Math.min(dur * .55, 6));
  master.to(col, { y: -12, duration: dur, ease: 'none' }, t0);

  if (s.layout === 'phone') {
    const ph = V ? phone(W / 2, 1010, 1110) : phone(520, 478, 800); sc.append(ph.p);
    master.fromTo(ph.p, { x: V ? 0 : -260, y: V ? 300 : 0, opacity: 0, rotationY: V ? 0 : 18 }, { x: 0, y: 0, opacity: 1, rotationY: 0, duration: 1, ease: 'power3.out' }, t0 - .1);
    master.to(ph.p, { y: '-=18', duration: dur, ease: 'sine.inOut' }, t0 + .9);
    const n = s.shots.length; const seg = dur / n;
    s.shots.forEach((sh, k) => {
      const st = t0 + k * seg, { d, hl } = addShot(ph, sh);
      if (k > 0) {
        master.set(d, { xPercent: 100 }, 0);
        master.to(d, { xPercent: 0, duration: .55, ease: 'power3.inOut' }, st - .25);
        events.push({ t: st - .25, type: 'swish' });
      }
      const k1 = ph.sw / SW;
      if (sh.focus) {
        const [fx, fy, fw, fh] = sh.focus; const z = Math.max(1, Math.min(ph.sh / (fh * k1), 1.8));
        const cx = (fx + fw / 2) * k1, cy = (fy + fh / 2) * k1;
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const tx = clamp(ph.sw / 2 - cx * z, ph.sw - ph.sw * z, 0), ty = clamp(ph.sh / 2 - cy * z, ph.sh - ph.sh * z, 0);
        master.fromTo(d, { scale: 1, x: 0, y: 0 }, { scale: z, x: tx, y: ty, duration: 1.2, ease: 'power2.inOut' }, st + .7);
      } else if (sh.pan) {
        master.fromTo(d, { scale: 1.12, x: -ph.sw * .06, y: 0 }, { y: -(ph.sh * 1.12 - ph.sh), duration: seg - .2, ease: 'sine.inOut' }, st + .1);
      } else {
        master.fromTo(d, { scale: 1 }, { scale: 1.035, x: -ph.sw * .0175, y: -ph.sh * .0175, duration: seg + .5, ease: 'none' }, st);
      }
      if (hl) {
        const ht = st + (sh.focus ? 1.9 : 1.0);
        master.fromTo(hl, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: .45, ease: 'back.out(2)' }, ht);
        events.push({ t: ht, type: sh.chime ? 'chime' : 'click' });
      }
      if (sh.chime && !hl) events.push({ t: st + .4, type: 'chime' });
    });
  } else if (s.layout === 'grid') {
    const xs = [250, 580, 910], hgt = 640;
    s.shots.forEach((sh, k) => {
      let node;
      if (sh.doc) {
        node = el('div', 'doc'); const im = el('img'); im.src = CAP + sh.img + '.png'; node.append(im);
        Object.assign(node.style, { left: '840px', top: '430px', width: '330px', rotate: '5deg' });
      } else { const ph = phone(xs[k] - 30, 470, hgt); node = ph.p; addShot(ph, sh); }
      sc.append(node);
      master.fromTo(node, { y: 600, opacity: 0 }, { y: 0, opacity: 1, duration: .9, ease: 'power3.out' }, t0 + .2 + k * .35);
      master.to(node, { y: k % 2 ? -26 : 18, duration: dur, ease: 'sine.inOut' }, t0 + 1.2 + k * .35);
    });
    events.push({ t: chipT, type: 'click' });
  } else if (s.layout === 'desk') {
    const lap = el('div', 'laptop'); const lid = el('div', 'lid'); const im = el('img'); im.src = CAP + s.shots[0].img + '.png'; lid.append(im); lap.append(lid, el('div', 'base'));
    Object.assign(lap.style, { left: '80px', top: '190px', width: '900px' }); sc.append(lap);
    const ph = phone(1040, 610, 600); sc.append(ph.p); addShot(ph, s.shots[1]);
    master.fromTo(lap, { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 1.1, ease: 'power3.out' }, t0);
    master.to(lap, { x: 20, duration: dur, ease: 'none' }, t0 + 1.1);
    master.fromTo(ph.p, { x: 300, opacity: 0, rotation: 6 }, { x: 0, opacity: 1, rotation: -3, duration: 1.1, ease: 'power3.out' }, t0 + .6);
  }
});

// Transitions : disque orange qui se dilate puis s'efface
const wipe = document.getElementById('wipe'); const R = Math.hypot(W, H);
Object.assign(wipe.style, { width: R * 2 + 'px', height: R * 2 + 'px', left: W / 2 - R + 'px', top: H / 2 - R + 'px' });
timing.scenes.forEach((tm, i) => {
  if (!i) return;
  master.fromTo(wipe, { scale: 0, opacity: 1, transformOrigin: '50% 50%' }, { scale: 1, duration: .38, ease: 'power2.in' }, tm.start - .38);
  master.to(wipe, { opacity: 0, duration: .4, ease: 'power1.out' }, tm.start);
});

// Fond qui dérive
master.fromTo('#topo', { rotation: -3, scale: 1.05 }, { rotation: 4, scale: 1.18, duration: timing.total, ease: 'none' }, 0);
master.fromTo('#bar', { width: 0 }, { width: W, duration: timing.total, ease: 'none' }, 0);

// Sous-titres
const subs = document.getElementById('subs');
Object.assign(subs.style, V ? { bottom: '110px', width: W - 120 + 'px' } : { bottom: '44px', width: '1500px' });
for (const tm of timing.scenes) for (const c of tm.cues) {
  const line = el('div'); const sp = el('span', 'line', c.text); line.append(sp); line.style.position = 'absolute'; line.style.left = 0; line.style.right = 0; line.style.bottom = 0; line.style.opacity = 0;
  subs.append(line);
  master.to(line, { opacity: 1, duration: .15 }, c.t0);
  master.to(line, { opacity: 0, duration: .15 }, Math.max(c.t0 + .2, c.t1 - .05));
}
master.set({}, {}, timing.total);

// Chargement complet avant rendu
await Promise.all([...document.images].map((i) => i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; })));
await document.fonts.ready;
window.__duration = timing.total;
window.__events = events.sort((a, b) => a.t - b.t);
window.__seek = (t) => { master.seek(t, false); };
window.__ready = true;
if (!q.has('render')) { master.play(); }
</script>
</body>
</html>
